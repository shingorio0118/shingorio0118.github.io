<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>shingo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tank.css">
</head><body data-time="day">
<!-- Tank drawing originally copied from shingorio0118/aquarium (index.html, commit 84a9191), since extended here. -->
<main class="stage">
<svg id="tank" viewBox="0 0 400 240" role="img" aria-label="ネオンテトラやエビが泳ぐ水槽。岩や水草はドラッグで移動、水の中をタップでエサやり">
<defs>
<!-- water / sand -->
<linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop id="wg0" offset="0" stop-color="#bfeefa"/><stop id="wg1" offset="1" stop-color="#3c9fc4"/></linearGradient>
<linearGradient id="sd" x1="0" y1="0" x2="0" y2="1"><stop id="sd0" offset="0" stop-color="#5a4a3c"/><stop id="sd1" offset="1" stop-color="#2e251d"/></linearGradient>
<linearGradient id="sdDepth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
<!-- lava -->
<radialGradient id="lava" cx=".32" cy=".28" r=".9"><stop offset="0" stop-color="#5a524c"/><stop offset=".45" stop-color="#2e2a27"/><stop offset="1" stop-color="#0c0b0a"/></radialGradient>
<radialGradient id="lavaHi" cx=".28" cy=".22" r=".65"><stop offset="0" stop-color="#b0a49a" stop-opacity=".75"/><stop offset=".5" stop-color="#6a5e56" stop-opacity=".25"/><stop offset="1" stop-color="#6a5e56" stop-opacity="0"/></radialGradient>
<!-- neon -->
<linearGradient id="neonBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#e2f0f6"/><stop offset=".75" stop-color="#a8c8d8"/><stop offset="1" stop-color="#6a92a8"/></linearGradient>
<linearGradient id="neonTail" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#cfe6f0" stop-opacity=".9"/><stop offset="1" stop-color="#cfe6f0" stop-opacity=".15"/></linearGradient>
<linearGradient id="neonFin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8d4e0" stop-opacity=".55"/><stop offset="1" stop-color="#b8d4e0" stop-opacity=".1"/></linearGradient>
<!-- shrimp -->
<linearGradient id="shrimpBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb09a" stop-opacity=".75"/><stop offset=".45" stop-color="#f06048" stop-opacity=".82"/><stop offset="1" stop-color="#c43828" stop-opacity=".7"/></linearGradient>
<!-- cory / oto -->
<linearGradient id="coryBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe0c0"/><stop offset="1" stop-color="#c4a878"/></linearGradient>
<linearGradient id="otoBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4c09a"/><stop offset="1" stop-color="#9a8560"/></linearGradient>
<!-- plants -->
<linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd868"/><stop offset=".6" stop-color="#4fa83a"/><stop offset="1" stop-color="#2e7a28"/></linearGradient>
<linearGradient id="leafR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0a0a8"/><stop offset=".5" stop-color="#d06a72"/><stop offset="1" stop-color="#a84850"/></linearGradient>
<linearGradient id="anubias" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a9a55"/><stop offset="1" stop-color="#1e5a28"/></linearGradient>
<!-- soft blur for far plants -->
<filter id="farBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
<!-- gentle vignette -->
<radialGradient id="hazeG" cx=".5" cy=".4" r=".75"><stop offset=".45" stop-color="#041018" stop-opacity="0"/><stop offset=".85" stop-color="#041018" stop-opacity=".22"/><stop offset="1" stop-color="#041018" stop-opacity=".42"/></radialGradient>
<!-- sand grain pattern -->
<pattern id="sandGrain" width="6" height="6" patternUnits="userSpaceOnUse">
 <circle cx="1" cy="1.5" r=".55" fill="#000" opacity=".28"/>
 <circle cx="4" cy="4" r=".4" fill="#fff" opacity=".2"/>
 <circle cx="2.5" cy="5" r=".35" fill="#000" opacity=".22"/>
 <circle cx="5" cy="1" r=".45" fill="#000" opacity=".18"/>
 <circle cx="3.5" cy="2.8" r=".3" fill="#fff" opacity=".12"/>
</pattern>
<!-- depth fade so caustic light is strongest near the surface -->
<linearGradient id="caustFadeG" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#fff"/>
 <stop offset=".35" stop-color="#fff"/>
 <stop offset=".7" stop-color="#666"/>
 <stop offset="1" stop-color="#000"/>
</linearGradient>
<mask id="caustFade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="200">
 <rect width="400" height="200" fill="url(#caustFadeG)"/>
</mask>
</defs>
<!-- layers back → front -->
<rect id="water" width="400" height="240" fill="url(#wg)"/>
<g id="far" class="fx" filter="url(#farBlur)" opacity=".45"></g>
<g id="rays" opacity=".22" fill="#fff"><polygon points="40,0 70,0 20,240 0,240"/><polygon points="160,0 175,0 130,240 115,240"/><polygon points="290,0 310,0 270,240 250,240"/></g>
<g id="caustics" class="fx" opacity=".55" mask="url(#caustFade)"></g>
<g id="plants"></g>
<path id="sand" d="M0 205 Q100 192 200 200 T400 198 V240 H0Z" fill="url(#sd)"/>
<path id="sandGrainOverlay" class="fx" d="M0 205 Q100 192 200 200 T400 198 V240 H0Z" fill="url(#sandGrain)" opacity="1"/>
<path id="sandDepth" class="fx" d="M0 205 Q100 192 200 200 T400 198 V240 H0Z" fill="url(#sdDepth)"/>
<g id="rocks"></g>
<g id="corys" class="fx"></g><g id="shrimps" class="fx l-shrimp"></g><g id="food" class="fx"></g><g id="fishes" class="fx l-fish"></g><g id="otos" class="fx"></g>
<g id="particles" class="fx"></g>
<g id="tbub" class="fx"></g>
<path id="surface" class="fx" d="M0 6 Q50 3 100 7 T200 5 T300 8 T400 4" fill="none" stroke="#fff" stroke-width="1.8" opacity=".55"/>
<path id="surfaceSheen" class="fx" d="M0 0 H400 V12 Q300 16 200 11 T0 14Z" fill="#fff" opacity=".14"/>
<rect id="glassRim" class="fx" x="0" y="0" width="400" height="3" fill="#fff" opacity=".35"/>
<rect id="glassSideL" class="fx" x="0" y="0" width="2" height="240" fill="#fff" opacity=".12"/>
<rect id="glassSideR" class="fx" x="398" y="0" width="2" height="240" fill="#fff" opacity=".1"/>
<rect id="haze" class="fx" width="400" height="240" fill="url(#hazeG)"/>
<rect id="tint" class="fx" width="400" height="240" fill="#fff" opacity="0"/>
</svg>
<div class="bar">
<div class="toggles" role="group" aria-label="表示の切り替え">
<button type="button" aria-pressed="true" data-l="fish">ネオンテトラ</button><button type="button" aria-pressed="true" data-l="shrimp">エビ</button><button type="button" aria-pressed="true" data-l="plants">水草</button><button type="button" aria-pressed="true" data-l="rocks">岩</button>
</div>
<button type="button" id="openPanel" class="gear" aria-expanded="false" aria-controls="panel">⚙️ カスタマイズ</button>
</div>
</main>
<aside id="panel" class="panel" hidden aria-labelledby="panelTitle">
<div class="ph"><h2 id="panelTitle">カスタマイズ</h2><button type="button" id="closePanel" class="x" aria-label="閉じる">×</button></div>
<section><h3>生きもの</h3>
<label class="sl"><span>ネオンテトラ <output id="o-neon">5</output>匹</span><input type="range" id="s-neon" data-k="neon" min="0" max="20" step="1" value="5"></label>
<label class="sl"><span>エビ <output id="o-shrimp">2</output>匹</span><input type="range" id="s-shrimp" data-k="shrimp" min="0" max="10" step="1" value="2"></label>
<div class="cnt"><span>コリドラス <output id="o-cory">0</output>匹</span><span class="pm"><button type="button" data-c="cory" data-d="-1" aria-label="コリドラスを減らす">−</button><button type="button" data-c="cory" data-d="1">＋追加</button></span></div>
<div class="cnt"><span>オトシンクルス <output id="o-oto">0</output>匹</span><span class="pm"><button type="button" data-c="oto" data-d="-1" aria-label="オトシンクルスを減らす">−</button><button type="button" data-c="oto" data-d="1">＋追加</button></span></div>
</section>
<section><h3>時間帯 <small id="autoNow"></small></h3><div class="seg" id="seg-time" role="group" aria-label="時間帯"></div></section>
<section><h3>底砂</h3><div class="seg" id="seg-sand" role="group" aria-label="底砂"></div></section>
<section><h3>背景</h3><div class="seg" id="seg-bg" role="group" aria-label="背景"></div></section>
<section><h3>レイアウト</h3><p class="hint">岩や水草はドラッグで動かせるよ。水の中をタップするとエサが落ちるよ。</p><button type="button" id="resetPos" class="wide">配置を元に戻す</button></section>
<section class="actions"><button type="button" id="share" class="wide primary">共有URLをコピー</button><button type="button" id="reset" class="wide danger">リセット</button>
<p id="msg" role="status" aria-live="polite"></p><input id="shareOut" type="text" readonly hidden aria-label="共有URL"></section>
</aside>
<script src="tank.js"></script>
</body></html>
