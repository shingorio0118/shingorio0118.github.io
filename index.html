<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>shingo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tank.css">
</head><body data-time="day">
<!-- Tank drawing originally copied from shingorio0118/aquarium (index.html, commit 84a9191), since extended here. -->
<main class="stage">
<svg id="tank" viewBox="0 0 400 240" role="img" aria-label="ネオンテトラやエビが泳ぐ水槽。岩や水草はドラッグで移動、水の中をタップでエサやり">
<defs>
<linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop id="wg0" offset="0" stop-color="#bfeefa"/><stop id="wg1" offset="1" stop-color="#3c9fc4"/></linearGradient>
<linearGradient id="sd" x1="0" y1="0" x2="0" y2="1"><stop id="sd0" offset="0" stop-color="#5a4a3c"/><stop id="sd1" offset="1" stop-color="#2e251d"/></linearGradient>
<radialGradient id="lava" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#4a4441"/><stop offset=".6" stop-color="#262321"/><stop offset="1" stop-color="#121010"/></radialGradient>
</defs>
<rect id="water" width="400" height="240" fill="url(#wg)"/>
<g id="rays" opacity=".25" fill="#fff"><polygon points="40,0 70,0 20,240 0,240"/><polygon points="160,0 175,0 130,240 115,240"/><polygon points="290,0 310,0 270,240 250,240"/></g>
<g id="plants"></g>
<path id="sand" d="M0 205 Q100 192 200 200 T400 198 V240 H0Z" fill="url(#sd)"/>
<g id="rocks"></g>
<g id="corys" class="fx"></g><g id="shrimps" class="fx l-shrimp"></g><g id="food" class="fx"></g><g id="fishes" class="fx l-fish"></g><g id="otos" class="fx"></g><g id="tbub" class="fx"></g>
<rect id="tint" class="fx" width="400" height="240" fill="#fff" opacity="0"/>
</svg>
<div class="bar">
<div class="toggles" role="group" aria-label="表示の切り替え">
<button type="button" aria-pressed="true" data-l="fish">ネオンテトラ</button><button type="button" aria-pressed="true" data-l="shrimp">エビ</button><button type="button" aria-pressed="true" data-l="plants">水草</button><button type="button" aria-pressed="true" data-l="rocks">岩</button>
</div>
<button type="button" id="openPanel" class="gear" aria-expanded="false" aria-controls="panel">⚙️ カスタマイズ</button>
</div>
</main>
<aside id="panel" class="panel" hidden aria-labelledby="panelTitle">
<div class="ph"><h2 id="panelTitle">カスタマイズ</h2><button type="button" id="closePanel" class="x" aria-label="閉じる">×</button></div>
<section><h3>生きもの</h3>
<label class="sl"><span>ネオンテトラ <output id="o-neon">5</output>匹</span><input type="range" id="s-neon" data-k="neon" min="0" max="20" step="1" value="5"></label>
<label class="sl"><span>エビ <output id="o-shrimp">2</output>匹</span><input type="range" id="s-shrimp" data-k="shrimp" min="0" max="10" step="1" value="2"></label>
<div class="cnt"><span>コリドラス <output id="o-cory">0</output>匹</span><span class="pm"><button type="button" data-c="cory" data-d="-1" aria-label="コリドラスを減らす">−</button><button type="button" data-c="cory" data-d="1">＋追加</button></span></div>
<div class="cnt"><span>オトシンクルス <output id="o-oto">0</output>匹</span><span class="pm"><button type="button" data-c="oto" data-d="-1" aria-label="オトシンクルスを減らす">−</button><button type="button" data-c="oto" data-d="1">＋追加</button></span></div>
</section>
<section><h3>時間帯 <small id="autoNow"></small></h3><div class="seg" id="seg-time" role="group" aria-label="時間帯"></div></section>
<section><h3>底砂</h3><div class="seg" id="seg-sand" role="group" aria-label="底砂"></div></section>
<section><h3>背景</h3><div class="seg" id="seg-bg" role="group" aria-label="背景"></div></section>
<section><h3>レイアウト</h3><p class="hint">岩や水草はドラッグで動かせるよ。水の中をタップするとエサが落ちるよ。</p><button type="button" id="resetPos" class="wide">配置を元に戻す</button></section>
<section class="actions"><button type="button" id="share" class="wide primary">共有URLをコピー</button><button type="button" id="reset" class="wide danger">リセット</button>
<p id="msg" role="status" aria-live="polite"></p><input id="shareOut" type="text" readonly hidden aria-label="共有URL"></section>
</aside>
<script src="tank.js"></script>
</body></html>
